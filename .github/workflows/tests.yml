name: Rust tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        mode: [public, extended]
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check build mode selection
        run: zsh scripts/test-build-mode.sh
      - name: Test and lint selected mode
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          flags=(--locked --no-default-features)
          if [[ "$BUILD_MODE" == extended ]]; then
            flags+=(--features extended-recording)
          fi
          cargo test "${flags[@]}"
          cargo clippy "${flags[@]}" --all-targets -- -D warnings
