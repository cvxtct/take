[package]
name = "take"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cvxtct/take"
description = "A local macOS audio recorder with a native AppKit interface"

[features]
default = []
extended-recording = []

[dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-audio-types = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
hound = "3.5"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSCell", "NSControl", "NSFont", "NSFontDescriptor", "NSMenu", "NSMenuItem", "NSWindow", "NSTextField", "NSPopUpButton", "NSProgressIndicator", "NSBezierPath", "NSAppearance", "NSScrollView", "NSClipView", "NSView", "NSColor", "NSResponder", "NSGraphics", "NSEvent", "NSRunningApplication", "objc2-core-foundation"] }

[dev-dependencies]
tempfile = "3.27.0"
